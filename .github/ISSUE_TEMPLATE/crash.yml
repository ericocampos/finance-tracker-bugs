name: Crash report
description: The app closed unexpectedly or froze.
title: "[Crash] "
labels: ["crash", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **This repository is public.** Redact tokens, account ids, and personal data from any logs or stack traces before pasting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy checklist
      options:
        - label: I have redacted any tokens, credentials, or personal data from logs and screenshots.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
  - type: input
    id: build_link
    attributes:
      label: Build link
      description: 'Paste the full Expo build URL of the APK you tested. Find the current one in the README → "Current test build". Reports without a valid build link cannot be triaged.'
      placeholder: https://expo.dev/accounts/ericocampos/projects/finance-tracker-mobile/builds/cf170fbf-15a0-4105-955d-c7adce4cabf7
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What were you doing when it crashed?
      placeholder: e.g. I tapped Save on the New Account screen and the app closed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (if known)
  - type: dropdown
    id: reproducibility
    attributes:
      label: How often does the crash happen?
      options:
        - Always (100%)
        - Often (>50%)
        - Sometimes (<50%)
        - Once
    validations:
      required: true
  - type: textarea
    id: stacktrace
    attributes:
      label: Stack trace / crash log
      description: Paste anything you got. Redact sensitive values.
      render: shell
  - type: input
    id: app_version
    attributes:
      label: App version / build number
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: Language / locale
    validations:
      required: true
