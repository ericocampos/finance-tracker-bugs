name: Feedback / suggestion
description: Not a bug — an idea, suggestion, or general feedback.
title: "[Feedback] "
labels: ["feedback", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **This repository is public.** Do not include real financial data or personal information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy checklist
      options:
        - label: My report contains no real financial data, names, emails, or credentials.
          required: true
  - type: input
    id: build_link
    attributes:
      label: Build link
      description: 'Paste the full Expo build URL of the APK your feedback is based on. Find the current one in the README → "Current test build".'
      placeholder: https://expo.dev/accounts/ericocampos/projects/finance-tracker-mobile/builds/cf170fbf-15a0-4105-955d-c7adce4cabf7
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: What's the idea, frustration, or suggestion?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Where in the app does this apply? (optional)
  - type: textarea
    id: why
    attributes:
      label: Why does this matter to you? (optional)
      description: Helps us understand the underlying need.
